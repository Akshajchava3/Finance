<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      background: #191200;
      color: #E8D870;
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 12px;
      border: 1px solid rgba(185,140,20,0.3);
    }

    /* ── Header ── */
    .hdr {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: #111000;
      border-bottom: 1px solid rgba(185,140,20,0.25);
    }
    .hdr-icon {
      width: 32px; height: 32px;
      background: #2A2100;
      border: 1px solid rgba(185,140,20,0.35);
      border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .hdr-text { display: flex; flex-direction: column; line-height: 1.1; }
    .hdr-bean  { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 2px; color: #C8F000; }
    .hdr-stock { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 2px; color: #C8F000; }
    .hdr-right { margin-left: auto; font-size: 10px; letter-spacing: 1.5px; color: #5A4A1A; text-transform: uppercase; }

    /* ── Status bar ── */
    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: #111000;
      border-bottom: 1px solid rgba(185,140,20,0.20);
      color: #5A4A1A;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #5A4A1A; flex-shrink: 0; }
    .dot.ok  { background: #C8F000; box-shadow: 0 0 5px rgba(200,240,0,0.5); }
    .dot.err { background: #FF3300; }
    .status.ok  { color: #C8F000; }
    .status.err { color: #FF3300; }

    /* ── Body ── */
    .body { padding: 12px 14px 10px; }

    /* Auto-detected pill */
    .auto-box {
      display: none;
      background: rgba(200,240,0,0.06);
      border: 1px solid rgba(200,240,0,0.25);
      border-radius: 3px;
      padding: 8px 10px;
      margin-bottom: 10px;
    }
    .auto-box.show { display: block; }
    .auto-lbl {
      font-size: 9px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: #5A4A1A; margin-bottom: 6px;
    }
    .auto-btn {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 8px 10px;
      background: rgba(200,240,0,0.08);
      border: 1px solid rgba(200,240,0,0.30);
      border-radius: 2px;
      color: #C8F000;
      font-size: 14px; font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.12s;
      font-family: inherit;
    }
    .auto-btn:hover { background: rgba(200,240,0,0.14); }
    .auto-btn span  { font-size: 10px; font-weight: 600; letter-spacing: 1.5px; color: #5A4A1A; text-transform: uppercase; }

    /* Divider */
    .div {
      display: none; align-items: center; gap: 7px;
      margin: 2px 0 10px; font-size: 9px; letter-spacing: 2px;
      text-transform: uppercase; color: #5A4A1A;
    }
    .div.show { display: flex; }
    .div::before, .div::after { content:''; flex:1; height:1px; background: rgba(185,140,20,0.20); }

    /* Manual search */
    .search-lbl { font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #5A4A1A; margin-bottom: 7px; }
    .row { display: flex; gap: 6px; }

    input {
      flex: 1;
      background: #201800;
      border: 1px solid rgba(185,140,20,0.30);
      border-radius: 3px;
      padding: 8px 10px;
      color: #E8D870;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      outline: none;
      transition: border-color 0.12s;
    }
    input:focus { border-color: rgba(200,240,0,0.5); box-shadow: 0 0 0 2px rgba(200,240,0,0.12); }
    input::placeholder { font-weight: 400; text-transform: none; letter-spacing: 0; color: #5A4A1A; font-size: 11px; }

    .go-btn {
      padding: 8px 14px;
      background: #C8F000;
      border: none;
      border-radius: 2px;
      color: #191200;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.12s;
      font-family: inherit;
    }
    .go-btn:hover { opacity: .85; }
    .go-btn:active { opacity: .70; }

    /* ── Recent history ── */
    .hist-wrap { display: none; margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(185,140,20,0.18); }
    .hist-wrap.show { display: block; }
    .hist-lbl { font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #5A4A1A; margin-bottom: 6px; }
    .hist-list { display: flex; flex-wrap: wrap; gap: 4px; }
    .hist-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 8px; border-radius: 2px; font-size: 10px; font-weight: 700;
      cursor: pointer; border: 1px solid transparent;
      font-family: 'JetBrains Mono', monospace; letter-spacing: 0.5px;
      transition: opacity 0.12s;
    }
    .hist-chip:hover { opacity: .75; }
    .hist-chip .hc-time { font-size: 8px; font-weight: 400; opacity: 0.55; font-family: 'Inter', sans-serif; letter-spacing: 0; }

    /* Footer */
    .ftr {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 14px 9px;
      border-top: 1px solid rgba(185,140,20,0.18);
      margin-top: 4px;
    }
    .ftr a { font-size: 9px; color: #5A4A1A; text-decoration: none; letter-spacing: 1px; text-transform: uppercase; transition: color 0.12s; }
    .ftr a:hover { color: #C8F000; }
    .ftr span { font-size: 9px; color: #3A2D00; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="hdr">
    <div class="hdr-icon">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
        <path d="M10 2.5C7.1 2.5 4.8 4.8 4.8 7.7c0 1.9.9 3.6 2.4 4.6V15h5.6v-2.7c1.5-1 2.4-2.7 2.4-4.6C15.2 4.8 12.9 2.5 10 2.5z" fill="#C8F000"/>
        <rect x="7" y="15.5" width="6" height="1.5" rx="0.75" fill="#C8F000"/>
      </svg>
    </div>
    <div class="hdr-text">
      <span class="hdr-bean">BEAN</span>
      <span class="hdr-stock">STOCK</span>
    </div>
    <span class="hdr-right">AGENT</span>
  </div>

  <div class="status" id="statusBar">
    <div class="dot" id="dot"></div>
    <span id="statusTxt">CHECKING SERVER…</span>
  </div>

  <div class="body">
    <div class="auto-box" id="autoBox">
      <div class="auto-lbl">Detected on this page</div>
      <button class="auto-btn" id="autoBtn">
        <span id="autoTicker">—</span>
        <span>ANALYZE →</span>
      </button>
    </div>

    <div class="div" id="div">or</div>

    <div class="search-lbl">Analyze any ticker</div>
    <div class="row">
      <input id="inp" placeholder="AAPL, TSLA, NVDA…" maxlength="6" autocomplete="off" spellcheck="false" />
      <button class="go-btn" id="goBtn">GO →</button>
    </div>

    <div class="hist-wrap" id="histWrap">
      <div class="hist-lbl">Recent</div>
      <div class="hist-list" id="histList"></div>
    </div>
  </div>

  <div class="ftr">
    <a href="http://localhost:3001" target="_blank">OPEN BEANSTOCK ↗</a>
    <span>NOT FINANCIAL ADVICE</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
